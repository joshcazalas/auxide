version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    # Local composite actions need their own discovery directories.
    directories:
      - /
      - /.github/actions/cache-auxide
      - /.github/actions/cache-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
