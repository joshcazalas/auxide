version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Songbird 0.6 exposes Reqwest 0.12 clients in its HLS API. Upgrade
      # them together when Songbird supports a newer Reqwest release.
      # Keep 0.12 patch updates enabled; 0.x minor bumps can break Rust APIs.
      - dependency-name: reqwest
        versions: [">=0.13"]

  - package-ecosystem: github-actions
    # Local composite actions need their own discovery directories.
    directories:
      - /
      - /.github/actions/cache-auxide
      - /.github/actions/cache-rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
