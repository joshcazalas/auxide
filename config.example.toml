[discord]
token_file = "/run/credentials/auxide.service/discord-token"

# Serve every server this application is installed in, which is the default.
# Installation is then the authorization boundary: with Public Bot disabled on
# the Bot page of the Discord Developer Portal, only this application's owner
# can add it anywhere. Auxide refuses to start if that is not the case, so the
# two settings cannot silently drift apart.
#
# Adding Auxide to another server needs no change to this file.
allow_all_guilds = true

# Servers held in memory at once. Each one owns a player, a worker, and a queue.
max_guilds = 50

# Nothing below is required. Add a [[discord.guilds]] block only to restrict a
# particular server; every other server keeps the permissive defaults above.
# Setting allow_all_guilds = false instead makes these blocks the complete
# allowlist, and every unlisted server is refused.
#
# [[discord.guilds]]
# guild_id = 123456789012345678
# # An empty list permits commands in every text channel in this server.
# command_channel_ids = [234567890123456789]
# # When both lists are empty, any member in the requester's voice channel is authorized.
# authorized_role_ids = []
# authorized_user_ids = []

[playback]
idle_timeout_seconds = 600
max_track_duration_seconds = 14400
max_queue_length = 100
actor_mailbox_capacity = 128
max_concurrent_resolutions = 2
# Level tracks play at, where 1.0 is the source's own level. Discord applies no
# normalisation and YouTube audio is mastered loud, so full scale is startling.
output_volume = 0.5

[youtube]
enabled = true
yt_dlp_path = "yt-dlp"
deno_path = "deno"
search_results = 5
resolution_timeout_seconds = 20
max_output_bytes = 1048576

[observability]
# Publish this port only to a private container network, never to the public Internet.
listen_address = "127.0.0.1:9090"
json_logs = true
log_filter = "auxide=info,serenity=info,songbird=info"
