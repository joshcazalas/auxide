[package]
name = "auxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A self-hosted, guild-scoped Discord music bot with current encrypted voice support"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
secrecy = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = { version = "=0.12.5", default-features = false, features = ["builder", "cache", "client", "gateway", "http", "model", "rustls_backend", "voice"] }
songbird = { version = "=0.6.0", features = ["builtin-queue"] }
# Songbird depends on Symphonia with default-features = false and enables no
# formats, so its probe knows only DCA and raw PCM and every real stream fails
# the moment it is probed. Symphonia registers a demuxer only when its feature
# is on, and Cargo features are additive, so naming them here is what turns
# playback on. Kept to what YouTube actually serves and what the operator guide
# uses as a control, because each one is a parser fed untrusted bytes:
# WebM/Opus and Ogg/Opus (songbird decodes Opus itself) and MP4/AAC.
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "isomp4",
    "mkv",
    "ogg",
] }
thiserror = "2.0"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
